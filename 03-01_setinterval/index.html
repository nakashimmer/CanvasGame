<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>03-01_setInterval</title>
    <style>
      canvas {
        border: 1px dotted gray;
        margin: 10px auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas1" width="300" height="300"></canvas>
    <script>
      const canvas1 = document.getElementById("canvas1");
      const ctx1 = canvas1.getContext("2d");

      // ① 初期設定
      const rect1 = {
        x: 100, y: 100, w: 50, h: 50, color: "indigo", dx: 1, dy: 1
      };

      // ② 関数の実行
      setInterval(loop, 50); // タイマ(関数名,ミリ秒)

      function loop() {
        // ① 画面消去
        ctx1.clearRect(0, 0, canvas1.width, canvas1.height);
        // ② 図形描画
        rectDraw(rect1);
        // ③ 移動計算
        rectCal(rect1);
      }

      // ③ 関数の定義
      function rectDraw(rect) {
        ctx1.fillStyle = rect.color;
        ctx1.fillRect(rect.x - rect.w / 2, rect.y - rect.h / 2, rect.w, rect.h);
      }

      // ④ 関数の定義(移動計算)
      function rectCal(rect) {
        rect.x += rect.dx;
        rect.y += rect.dy;
        if ((rect.x < rect.w / 2) || (canvas1.width - rect.w / 2 < rect.x)) {
          rect.dx *= -1;
        }
        if ((rect.y < rect.h / 2) || (canvas1.height - rect.h / 2 < rect.y)) {
          rect.dy *= -1;
        }
      }
    </script>
  </body>
</html>
