<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>03-02_raf</title>
    <meta name="viewport" content="width=device-width">
  </head>
  <body>
    <p id="output1"></p>
    <script>
      const output1 = document.getElementById("output1");

      requestAnimationFrame(animate);

      function animate(timestamp) {
        output1.innerHTML = timestamp + "ミリ秒";
        requestAnimationFrame(animate);
      }
    </script>
  </body>
</html>
