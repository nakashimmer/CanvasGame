<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>06-01_css</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      #canvas1 {
        background-image: url(bg1.png);
        background-size: cover;
        border: 4px solid #f5f5f5;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      h1 {
        color: #f5f5f5;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <h1>STAR CATCHER</h1>
    <canvas id="canvas1" width="400" height="400"></canvas>
    <script>
      // 要素の取得
      const canvas1 = document.getElementById("canvas1");
      const ctx1 = canvas1.getContext("2d");

      // 効果音
      const audio1 = new Audio();
      audio1.src = "audio1.mp3";

      // 初期値(5-2-3) 画像版
      const target1 = { x: 200, y: 100, w: 50, h: 50, dir: 1, img: new Image() };
      target1.img.src = "target1.png";

      const player1 = { x: 200, y: 300, w: 50, h: 50, img: new Image() };
      player1.img.src = "player1.png";

      const ball1 = { x: -10, y: -10, w: 5, h: 5, img: new Image() };
      ball1.img.src = "ball1.png";

      const point1 = { value: 0 };

      // RAFでゲーム開始
      let lastTime = 0;
      // イベント処理定義===================================
      canvas1.addEventListener(
        "mousedown",
        (e) => {
          ball1.x = player1.x;
          ball1.y = player1.y;
        }
      );

      canvas1.addEventListener(
        "mousemove",
        (e) => {
          const rect = e.target.getBoundingClientRect();
          player1.x = e.clientX - rect.left;
        }
      );

      // 関数定義===============================
      function clearDraw(canvas) {
        ctx1.clearRect(0, 0, canvas.width, canvas.height);
      }

      // ⑤画像を描画（ライブラリ game.js に追加済）
      function imgDraw(image) {
        ctx1.drawImage(image.img, image.x - image.w / 2, image.y - image.h / 2);
      }

      function pointDraw(point) {
        ctx1.fillStyle = "black";
        ctx1.font = "20px sans-serif";
        ctx1.fillText(point.value, 0, 400);
      }

      //③game1関数（改造後：timestampを受け取る）(39行目)
      function game1(timestamp) {
        if (lastTime === 0) { // 初回のみ現在時刻を保存
          lastTime = timestamp;
        }
        const deltaTime = timestamp - lastTime; // 経過時間(ms)
        lastTime = timestamp; // 今回の時刻を保存

        //関数の実行 (5-2-4)----------------------
        clearDraw(canvas1);
        imgDraw(target1);
        imgDraw(player1);
        imgDraw(ball1);
        pointDraw(point1);
        rectCal(canvas1, target1, ball1, point1, audio1, deltaTime);

        // 次のフレームを予約★ (86行目)
        requestAnimationFrame(game1);
      }

      function rectCal(canvas, target, ball, point, audio, deltaTime) {
        //移動計算 ★ (67行目)
        target.x += target.dir * deltaTime / 50;
        ball.y -= 5 * deltaTime / 50;

        //壁衝突計算
        if ((target.x < target.w / 2) || (canvas.width - target.w / 2 < target.x)) {
          target.dir *= -1;
        }

        //得点判定 ★ (76行目)
        if (Math.abs(ball.y - 100) < 5 && Math.abs(target.x - ball.x) < 25) {
          point.value++; ball.x = -10; ball.y = -10;
          audio.play();
        }
      }

      // game1関数の定義がここまで終わったので、ここで初回のRAFを予約してゲームを開始する
      requestAnimationFrame(game1);
    </script>
  </body>
</html>
