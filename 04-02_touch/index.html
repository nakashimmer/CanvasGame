<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>04-02_touch</title>
    <style>
      canvas {
        border: 1px dotted gray;
        margin: 10px auto;
        display: block;
      }
       p.help {
        color: #666;
        font-size: 13px;
        text-align:center;
      }
      #qr {
        display: block;
        margin: 0 auto;
        width: 150px;
      }
    </style>
  </head>
  <body>
    <p class="help">スマホで操作してください</p>
    <canvas id="canvas1" width="310" height="320"></canvas>
    <p><img id="qr" src="touch.png" alt="QRコード"></p>
    <script>
      const canvas1 = document.getElementById("canvas1");
      const ctx1 = canvas1.getContext("2d");
      const pos = { x: 150, y: 150 };
      let f = false;

      //指で操作
      canvas1.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          const rect = e.target.getBoundingClientRect();
          pos.x = e.touches[0].clientX - rect.left;
          pos.y = e.touches[0].clientY - rect.top;
          ctx1.fillStyle = "green";
          ctx1.fillRect(pos.x - 2, pos.y - 2, 4, 4);
        }, { passive: false }
      );
    </script>
  </body>
</html>
