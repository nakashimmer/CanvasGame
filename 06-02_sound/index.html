<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>06-02_sound</title>
    <meta name="viewport" content="width=device-width">
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }

      #canvas1 {
        background-image: url(bg1.png);
        background-size: cover;
        border: 4px solid #f5f5f5;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      h1 {
        color: #f5f5f5;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <h1>STAR CATCHER</h1>
    <canvas id="canvas1" width="400" height="400"></canvas>
    <script>
      // 要素の取得
      const canvas1 = document.getElementById("canvas1");
      const ctx1 = canvas1.getContext("2d");

      // 6.2 効果音
      const seHit = new Audio("hit.mp3");   // 命中音
      const seMiss = new Audio("miss.mp3");  // ミス音
      const bgm = new Audio("bgm.mp3");   // BGM
      bgm.loop = true;

      // 初期値(5-2-3) 画像版
      const target1 = { x: 200, y: 100, w: 50, h: 50, dir: 1, img: new Image() };
      target1.img.src = "target1.png";

      const player1 = { x: 200, y: 300, w: 50, h: 50, img: new Image() };
      player1.img.src = "player1.png";

      const ball1 = { x: -10, y: -10, w: 5, h: 5, img: new Image() };
      ball1.img.src = "ball1.png";

      const point1 = { value: 0 };

      // RAFでゲーム開始
      let lastTime = 0;
      // イベント処理定義===================================
      canvas1.addEventListener("mousedown",
        (e) => {
          // 6.2：ブラウザの自動再生制限への対処。最初のクリックでBGMを開始する
          if (bgm.paused) { bgm.play(); }
          ball1.x = player1.x;
          ball1.y = player1.y;
        }
      );

      canvas1.addEventListener("mousemove",
        (e) => {
          const rect = e.target.getBoundingClientRect();
          player1.x = e.clientX - rect.left;
        }
      );

      // 関数定義===============================
      function clearDraw(canvas) {
        ctx1.clearRect(0, 0, canvas.width, canvas.height);
      }

      function imgDraw(image) {
        ctx1.drawImage(image.img, image.x - image.w / 2, image.y - image.h / 2);
      }

      function pointDraw(point) {
        ctx1.fillStyle = "black";
        ctx1.font = "20px sans-serif";
        ctx1.fillText(point.value, 0, 400);
      }

      function game1(timestamp) {
        if (lastTime === 0) {
          lastTime = timestamp;
        }
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        clearDraw(canvas1);
        imgDraw(target1);
        imgDraw(player1);
        imgDraw(ball1);
        pointDraw(point1);
        rectCal(canvas1, target1, ball1, point1, deltaTime);

        requestAnimationFrame(game1);
      }

      function rectCal(canvas, target, ball, point, deltaTime) {
        // 移動計算
        target.x += target.dir * deltaTime / 50;
        ball.y -= 5 * deltaTime / 50;

        // 壁衝突計算
        if ((target.x < target.w / 2) || (canvas.width - target.w / 2 < target.x)) {
          target.dir *= -1;
        }

        // 得点判定（6.2：命中音を鳴らす。currentTimeをリセットして連続再生に対応）
        if (Math.abs(ball.y - 100) < 5 && Math.abs(target.x - ball.x) < 25) {
          point.value++; ball.x = -10; ball.y = -10;
          seHit.currentTime = 0; // 再生位置をリセット
          seHit.play();
        }

        // 見逃し判定（画面上端を越えたらミス音）
        if (ball.y < 0 && ball.x !== -10) {
          ball.x = -10; ball.y = -10;
          seMiss.currentTime = 0;
          seMiss.play();
        }
      }

      // game1関数の定義がここまで終わったので、ここで初回のRAFを予約してゲームを開始する
      requestAnimationFrame(game1);
    </script>
  </body>
</html>
